<circle cx="510" cy="142" r="60" fill="none" stroke="rgba(240,237,226,0.35)" stroke-width="1.5"/><circle cx="510" cy="142" r="40" fill="none" stroke="rgba(240,237,226,0.25)" stroke-width="1.5"/><circle cx="510" cy="142" r="20" fill="none" stroke="rgba(240,237,226,0.2)" stroke-width="1.5"/><path d="M 450 142 L 570 142 M 510 82 L 510 202" stroke="rgba(240,237,226,.15)" stroke-width="1"/><g class="spin" style="transform-origin:510px 142px;animation:spin 6s linear infinite"><path d="M 510 142 L 570 142 A 60 60 0 0 0 556.0 103.4 Z" fill="url(#sweep)"/><path d="M 510 142 L 570 142" stroke="#E90507" stroke-width="2"/></g><circle cx="536" cy="112" r="4" fill="#FF3B45"/><circle cx="476" cy="156" r="3" fill="rgba(240,237,226,.8)"/><circle cx="522" cy="182" r="3" fill="rgba(240,237,226,.6)"/>
