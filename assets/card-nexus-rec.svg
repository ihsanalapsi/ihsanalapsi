<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Nexus-REC: Automated recon and vulnerability assessment framework.">
<style>@font-face{font-family:"Geist";src:url(data:font/woff2;base64,) format("woff2");font-weight:100 900}@font-face{font-family:"Geist Mono";src:url(data:font/woff2;base64,) format("woff2");font-weight:100 900}
.kicker{font:500 16px "Geist Mono",monospace;letter-spacing:.2em;fill:#FF3B45}
.title{font:700 44px "Geist",sans-serif;letter-spacing:-.035em;fill:#fff}
.desc{font:400 21px "Geist",sans-serif;letter-spacing:-.005em;fill:rgba(255,255,255,.74)}
.chip{font:500 17px "Geist Mono",monospace;letter-spacing:.02em;fill:rgba(255,255,255,.74)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.motion{display:none}.spin{animation:none}}</style>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1716"/><stop offset="1" stop-color="#17120F"/></linearGradient>
<radialGradient id="wine" cx="82%" cy="45%" r="45%"><stop offset="0" stop-color="#470C17" stop-opacity=".55"/><stop offset="1" stop-color="#470C17" stop-opacity="0"/></radialGradient>
<radialGradient id="sweep" cx="0" cy="0" r="1"><stop offset="0" stop-color="#E90507" stop-opacity=".05"/><stop offset="1" stop-color="#E90507" stop-opacity=".45"/></radialGradient>
</defs>
<rect x=".5" y=".5" width="639" height="299" rx="18" fill="url(#panel)" stroke="rgba(240,237,226,.12)"/>
<rect x=".5" y=".5" width="639" height="299" rx="18" fill="url(#wine)"/>
<rect x="40" y="0.5" width="56" height="3" fill="#E90507"/>
<path d="M 588 40 L 602 26 M 591 26 L 602 26 L 602 37" fill="none" stroke="rgba(240,237,226,.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
