<radialGradient id="sweep" cx="0" cy="0" r="1"><stop offset="0" stop-color="#E90507" stop-opacity=".05"/><stop offset="1" stop-color="#E90507" stop-opacity=".45"/></radialGradient>
</defs>
<rect x=".5" y=".5" width="639" height="299" rx="18" fill="url(#panel)" stroke="rgba(240,237,226,.12)"/>
