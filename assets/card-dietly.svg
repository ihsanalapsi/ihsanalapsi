<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Dietly: A platform for nutritionists: patients, meal plans, AI tools.">
<style>@font-face{font-family:"Geist";src:url(data:font/woff2;base64,) format("woff2");font-weight:100 900}@font-face{font-family:"Geist Mono";src:url(data:font/woff2;base64,) format("woff2");font-weight:100 900}
.kicker{font:500 16px "Geist Mono",monospace;letter-spacing:.2em;fill:#FF3B45}
.title{font:700 44px "Geist",sans-serif;letter-spacing:-.035em;fill:#fff}
.desc{font:400 21px "Geist",sans-serif;letter-spacing:-.005em;fill:rgba(255,255,255,.74)}
.chip{font:500 17px "Geist Mono",monospace;letter-spacing:.02em;fill:rgba(255,255,255,.74)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.motion{display:none}.spin{animation:none}}</style>
